name: V2 build check

on:
  push:
    branches:
      - main
      - v2-handoff-ui
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Next.js build
        run: npm run build

      - name: Cloudflare Workers build
        run: npm run build:cloudflare

      - name: Validate generated Worker deployment
        run: npx wrangler deploy --dry-run --config dist/server/wrangler.json
