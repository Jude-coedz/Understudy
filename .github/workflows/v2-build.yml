name: V2 build check

on:
  push:
    branches:
      - v2-handoff-ui
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Next.js build
        run: npm run build

      - name: Cloudflare Workers build
        run: npm run build:cloudflare

      - name: Commit resolved lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update Cloudflare deployment lockfile"
          git push origin HEAD:v2-handoff-ui
