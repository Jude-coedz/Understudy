name: V2 build check

on:
  push:
    branches:
      - main
      - v2-handoff-ui
      - v2-functional-sources
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Next.js application
        run: npm run build:next

      - name: Cloudflare build command
        run: npm run build

      - name: Cloudflare deploy command dry run
        run: npx wrangler deploy --dry-run
