name: V2 build check

on:
  push:
    branches:
      - v2-handoff-ui
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Next.js build
        run: npm run build

      - name: Cloudflare Workers build
        run: npm run build:cloudflare

      - name: Save resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock
          path: package-lock.json
