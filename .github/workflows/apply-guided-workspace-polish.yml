name: Apply guided workspace polish

on:
  push:
    branches:
      - ux-scale-privacy-polish

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-scale-privacy-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/apply-guided-workspace-polish.mjs
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish scalable evidence and final actions"
          git push origin HEAD:ux-scale-privacy-polish
