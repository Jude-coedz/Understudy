name: Apply flow integrity UX fixes

on:
  push:
    branches:
      - ux-flow-integrity-pass

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-flow-integrity-pass
      - name: Apply product patch
        run: python scripts/apply_flow_integrity.py
      - name: Validate application
        run: |
          npm ci
          npm run build
          npx vinext build
          npx wrangler deploy --dry-run
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-flow-integrity.yml scripts/apply_flow_integrity.py
          git add components app
          git commit -m "Fix focused handoff flow integrity"
          git push origin HEAD:ux-flow-integrity-pass
