name: Apply next checkpoint action fix

on:
  push:
    branches:
      - fix-next-checkpoint-action

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-next-checkpoint-action
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-next-checkpoint-action.mjs
      - name: Commit generated fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/evidence-workspace.tsx
          git commit -m "Fix next checkpoint contextual action"
          git push origin HEAD:fix-next-checkpoint-action
