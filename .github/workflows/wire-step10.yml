name: Wire Step 10 uploads

on:
  push:
    branches:
      - v2-document-ingestion

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-document-ingestion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wire-modern-uploads.mjs
      - name: Commit generated wiring
        run: |
          if git diff --quiet; then
            echo "No wiring changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/onboarding-flow-polished.tsx components/evidence-workspace.tsx
          git commit -m "Wire modern document uploads into product flows"
          git push origin HEAD:v2-document-ingestion
